<!doctype html><html><head><meta charset="utf-8">
<style>
:root{--p:#204E40;--pd:#15382D;--pl:#EEF2E9;--y:#D8ED9B;--yd:#8FD463;--tx:#172F29;--mu:#6B7872;--gr:#16A34A}
html,body{width:1080px;height:1920px;margin:0;overflow:hidden;background:#fff;font-family:Inter,sans-serif;color:var(--tx)}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse 950px 760px at 50% 42%, var(--pl), #fff 72%)}
#world{position:absolute;inset:0;transform-origin:540px 800px}
.sc{position:absolute;inset:0;display:none}
.card{position:absolute;background:#fff;border-radius:36px;box-shadow:0 18px 50px rgba(32,78,64,.13),0 0 0 2px var(--pl)}
.pill{position:absolute;border-radius:999px;font-weight:800;font-size:48px;padding:14px 34px;white-space:nowrap}
.pp{background:var(--p);color:#fff}.py{background:var(--y);color:var(--tx)}
.chip{position:absolute;background:#fff;border:2px solid #dfe6dc;border-radius:999px;font-weight:800;text-align:center;color:var(--tx)}
.h{position:absolute;left:60px;right:60px;text-align:center;font-weight:800;letter-spacing:-1.5px;line-height:1.08}
.mut{color:var(--mu)}
#cap{position:absolute;left:40px;right:40px;top:1418px;text-align:center;font-weight:800;font-size:66px;line-height:1.25;z-index:10}
#cap b{display:inline-block;padding:2px 16px;margin:0 2px;border-radius:16px;text-shadow:0 0 12px #fff,0 2px 0 #fff}
#cap b.on{background:var(--gr);color:#fff;text-shadow:none}
#prog{position:absolute;left:0;bottom:0;height:10px;background:var(--p);z-index:11}
#tap{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:#fff;box-shadow:0 0 0 8px var(--p),0 10px 30px rgba(32,78,64,.25);display:none;z-index:9}
#ripple{position:absolute;border-radius:50%;border:6px solid var(--yd);display:none;z-index:8}
/* word card (tracked object) */
#wc{position:absolute;left:0;top:0;width:620px;height:420px;margin:-210px 0 0 -310px;z-index:6}
#wc .face{position:absolute;inset:0;border-radius:36px;background:#fff;box-shadow:0 18px 50px rgba(32,78,64,.16),0 0 0 2px var(--pl);display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden}
#wc .tag{background:var(--pl);color:#476348;border-radius:999px;font-weight:700;font-size:32px;padding:8px 22px}
#wc .lang{color:var(--mu);font-size:30px;margin-top:22px}
#wc .term{font-weight:800;font-size:118px;letter-spacing:-3px;margin-top:4px}
#wc .term.az{font-size:84px;letter-spacing:-2px}
#wc .term span{display:inline-block}
/* notebook */
#nb{left:150px;top:300px;width:780px;height:1060px;overflow:hidden;background:#fffdf7;border-radius:36px;box-shadow:0 18px 50px rgba(32,78,64,.13),0 0 0 2px #efe9da}
#nb .margin{position:absolute;left:96px;top:0;bottom:0;width:3px;background:#e9b9b0}
#nbList{position:absolute;left:0;right:0;top:0}
.ln{position:absolute;left:0;right:0;height:84px;border-bottom:2px solid #dfe8f0}
.ent{position:absolute;left:128px;font-size:46px;font-weight:600;color:#2b3f5c;white-space:nowrap}
.ent i{font-style:normal;color:#7d8aa0;font-weight:500}
/* app */
#scr{left:150px;top:290px;width:780px;padding:0;overflow:hidden}
#scr .bar{height:56px;background:var(--tx);display:flex;align-items:center;justify-content:center}
#scr .bar i{display:block;width:120px;height:14px;border-radius:7px;background:#3b4f49}
#scr img{display:block;width:780px}
#lvlLab{position:absolute;left:95px;top:1010px;font-size:40px;font-weight:700;color:var(--mu)}
.lv{top:1070px;width:122px;height:96px;line-height:92px;font-size:42px}
/* boxes */
#bxImg{position:absolute;left:80px;top:330px;width:600px;border-radius:30px;box-shadow:0 18px 50px rgba(32,78,64,.13),0 0 0 2px var(--pl)}
.mc{position:absolute;width:236px;height:92px;margin:-46px 0 0 -118px;background:#fff;border-radius:24px;box-shadow:0 12px 30px rgba(32,78,64,.18),0 0 0 3px var(--p);font-weight:800;font-size:44px;text-align:center;line-height:92px;z-index:5}
.mc.b{box-shadow:0 12px 30px rgba(32,78,64,.18),0 0 0 3px var(--yd)}
.mp{font-size:40px;padding:10px 26px;z-index:6}
/* cta */
.lc{left:240px;width:600px;height:124px;line-height:120px;font-size:56px}
#bub{position:absolute;left:250px;top:1110px;width:580px;height:150px}
</style></head><body>
<div id="bg"></div>
<div id="world">
 <!-- HOOK -->
 <div class="sc" id="HOOK"><div class="h" id="hookT" style="top:300px;font-size:86px">Niyə daha bir<br>dil tətbiqi?</div>
  <div class="pill pp" id="pOk" style="left:540px;top:1120px">Öyrənmək ✓</div>
  <div class="pill py" id="pQ" style="left:540px;top:1120px">Yadda saxlamaq?</div></div>
 <!-- NOTEBOOK -->
 <div class="sc" id="NOTE"><div class="card" id="nb"><div class="margin"></div><div id="nbList"></div></div></div>
 <!-- LOGO -->
 <div class="sc" id="LOGO"><div id="logoBox" style="position:absolute;left:390px;top:560px;width:300px;height:300px">__LOGO__</div>
  <div class="h" id="logoT" style="top:900px;font-size:110px;letter-spacing:-3px">Vocabox</div></div>
 <!-- APP -->
 <div class="sc" id="APP"><div class="card" id="scr"><div class="bar"><i></i></div><img src="__TOP__"></div>
  <div id="lvlLab">Dil səviyyəsi</div>
  <div class="chip lv" id="lv0" style="left:95px">A1</div><div class="chip lv" id="lv1" style="left:233px">A2</div><div class="chip lv" id="lv2" style="left:371px">B1</div>
  <div class="chip lv" id="lv3" style="left:509px">B2</div><div class="chip lv" id="lv4" style="left:647px">C1</div><div class="chip lv" id="lv5" style="left:785px">C2</div></div>
 <!-- BOXES -->
 <div class="sc" id="BOX"><img id="bxImg" src="__BOXES__">
  <div class="mc" id="mcA">vote</div><div class="mc b" id="mcB">extreme</div>
  <div class="pill pp mp" id="pPlus">Düz · +1</div><div class="pill py mp" id="pMinus">Səhv · −1</div></div>
 <!-- CTA -->
 <div class="sc" id="CTA"><div class="h" id="ctaT" style="top:330px;font-size:80px">Sən hansı dili<br>öyrənirsən?</div>
  <div class="chip lc" id="lc0" style="top:620px">İngilis dili</div><div class="chip lc" id="lc1" style="top:774px">Rus dili</div><div class="chip lc" id="lc2" style="top:928px">Alman dili</div>
  <svg id="bub" viewBox="0 0 580 150"><path d="M40 0h500a40 40 0 0 1 40 40v50a40 40 0 0 1-40 40H120l-50 20 10-20H40A40 40 0 0 1 0 90V40A40 40 0 0 1 40 0z" fill="#204E40"/>
   <g transform="translate(118 64) rotate(-18)"><path d="M-34 -4 L34 -26 L12 30 L2 6 Z" fill="#D8ED9B"/><path d="M2 6 L34 -26" stroke="#204E40" stroke-width="5" stroke-linecap="round"/></g><text x="330" y="84" text-anchor="middle" font-family="Inter" font-weight="800" font-size="54" fill="#fff">Mesaj yaz</text></svg>
  <div id="ctaLogo" style="position:absolute;left:390px;top:1300px;width:300px;display:flex;align-items:center;gap:18px;justify-content:center"><div style="width:84px;height:84px">__LOGO2__</div><b style="font-size:54px;letter-spacing:-1.5px">Vocabox</b></div></div>
 <!-- tracked word card -->
 <div id="wc"><div class="face" id="wcF"><div class="tag">Qutu 3 · B1</div><div class="lang">İngilis dili</div><div class="term" id="wcT"></div></div>
  <div class="face" id="wcB" style="transform:rotateY(180deg)"><div class="tag">Qutu 3 · B1</div><div class="lang">Azərbaycan dili</div><div class="term az">səs vermək</div></div></div>
</div>
<div id="tap"></div><div id="ripple"></div>
<div id="cap"></div><div id="prog"></div>
<script>
const WORDS=__WORDS__,OFF=0.4,LEAD=2/30;
const TT=Math.ceil((WORDS.at(-1).end+OFF+2)*30)/30;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),seg=(t,a,b)=>cl((t-a)/(b-a)),lerp=(a,b,x)=>a+(b-a)*x;
const eo=x=>1-(1-x)**3,eio=x=>x<.5?4*x**3:1-(-2*x+2)**3/2,back=x=>1+2.70158*(x-1)**3+1.70158*(x-1)**2;
const norm=s=>s.toLowerCase().replace(/[.,?!:;“”"«»]/g,'');
function Wd(w,n=1){let c=0;for(const x of WORDS)if(norm(x.text)===w&&++c===n)return x;throw Error('söz yoxdur: '+w)}
const W=(w,n)=>Wd(w,n).start+OFF, WE=(w,n)=>Wd(w,n).end+OFF;
const E={
 flip:W('çünki')-LEAD, ok:W('deyil')-LEAD, fadeA:W('yadda'), fadeB:WE('saxlamaqdır'), q:W('çətini')-LEAD,
 note:W('dəftər')-LEAD, dolur:W('dolur'), siyahi:W('siyahı')-LEAD, uzanir:WE('uzanır'), forget:W('sözlər'), forgetE:WE('çıxır'),
 logo:W('vocabox')-LEAD, app:W('hazır')-LEAD, lvl:W('səviyyənə')-LEAD, pick:W('seçirsən'),
 box:W('bildiyin')-LEAD, fwd:W('irəli')-LEAD, hard:W('çətin',2)-LEAD, back:W('söz',3), again:W('qarşına')-LEAD,
 cta:W('sən')-LEAD, l0:W('hansı'), l1:W('dili'), l2:W('öyrənirsən'), com:W('mesajla')-LEAD, deck:W('dəsti'), gost:W('göstərək')
};
// ---- captions
const CH=[];{let c=[];const L=a=>a.reduce((s,i)=>s+WORDS[i].text.length+1,0);
 WORDS.forEach((w,i)=>{if(c.length&&L(c)+w.text.length>24){CH.push(c);c=[]}c.push(i);if(c.length===3||/[.,?!]$/.test(w.text)||i===WORDS.length-1){CH.push(c);c=[]}})}
function caption(t){const el=document.getElementById('cap');let k=-1;CH.forEach((c,j)=>{if(t>=WORDS[c[0]].start+OFF-.02)k=j});
 if(k<0)return el.innerHTML='';const last=WORDS[CH[k].at(-1)],nx=CH[k+1];
 if(t>last.end+OFF+.6&&(!nx||t<WORDS[nx[0]].start+OFF-.02))return el.innerHTML='';
 const h=CH[k].map(i=>{const w=WORDS[i];return `<b${t>=w.start+OFF&&t<w.end+OFF?' class="on"':''}>${w.text}</b>`}).join('');if(el.innerHTML!==h)el.innerHTML=h}
function show(id,t,a,b){const el=document.getElementById(id);if(t<a||t>=b){el.style.display='none';return 0}
 el.style.display='block';el.style.opacity=Math.min(eo(seg(t,a,a+.4)),1-seg(t,b-.35,b));return 1}
const $=id=>document.getElementById(id);
function pop(el,t,a,cx,cy,dur=.4){const x=seg(t,a,a+dur);el.style.display=x>0?'block':'none';
 const s=x<1?back(x):1;el.style.transform=`translate(-50%,-50%) scale(${Math.max(0,s)})`;el.style.left=cx+'px';el.style.top=cy+'px';el.style.opacity=cl(x*3)}
// ---- notebook entries
const ENT=[['vote','səs vermək'],['extreme','ifrat'],['borrow','borc almaq'],['however','lakin'],['achieve','nail olmaq'],['decide','qərar vermək'],['likely','ehtimal ki'],['improve','yaxşılaşdırmaq'],['remind','xatırlatmaq'],['though','baxmayaraq'],['support','dəstək'],['measure','ölçmək'],['approach','yanaşma'],['require','tələb etmək'],['purpose','məqsəd'],['notice','fərq etmək']];
{const L=$('nbList');for(let i=0;i<22;i++){const d=document.createElement('div');d.className='ln';d.style.top=(60+i*84)+'px';L.appendChild(d)}
 ENT.forEach((e,i)=>{const d=document.createElement('div');d.className='ent';d.id='e'+i;d.style.top=(60+i*84+14)+'px';d.innerHTML=`${e[0]} <i>— ${e[1]}</i>`;L.appendChild(d)})}
$('wcT').innerHTML=[...'vote'].map(c=>`<span>${c}</span>`).join('');
function tapAt(t,a,x,y){const T=$('tap'),R=$('ripple');const u=seg(t,a-.35,a+.45);
 if(u<=0||u>=1){T.style.display=R.style.display='none';return}
 T.style.display='block';T.style.left=x+'px';T.style.top=y+'px';
 const press=seg(t,a-.08,a+.04),rel=seg(t,a+.04,a+.2);T.style.transform=`scale(${1-.18*press+.18*rel})`;T.style.opacity=Math.min(seg(t,a-.35,a-.15),1-seg(t,a+.3,a+.45));
 const r=seg(t,a,a+.45);R.style.display=r>0&&r<1?'block':'none';const rr=40+90*eo(r);R.style.left=(x-rr)+'px';R.style.top=(y-rr)+'px';R.style.width=R.style.height=2*rr+'px';R.style.opacity=1-r}
function render(t){caption(t);$('prog').style.width=(1080*(1-4**-cl(t/TT))/(1-1/4))+'px';
 // global slow camera: gentle zoom per scene
 const sceneStart=[0,E.note,E.logo,E.app,E.box,E.cta].filter(a=>a<=t).at(-1);
 const cam=1+0.035*eio(seg(t,sceneStart,sceneStart+3));$('world').style.transform=`scale(${cam})`;
 // ===== HOOK (0 → note)
 const wc=$('wc');let wcx=540,wcy=800,ws=1,wr=-4,wop=1;
 if(show('HOOK',t,-1,E.note+.5)){
  $('hookT').style.opacity=1-seg(t,E.note-.1,E.note+.25);
  pop($('pOk'),t,E.ok,540,1150);$('pOk').style.opacity=Math.min(cl(seg(t,E.ok,E.ok+.15)*3),1-seg(t,E.q,E.q+.25));
  pop($('pQ'),t,E.q+.15,540,1150);$('pQ').style.opacity=Math.min(cl(seg(t,E.q+.15,E.q+.3)*3),1-seg(t,E.note-.2,E.note+.1));
  if(t>=E.q+.15+.4)$('pQ').style.transform='translate(-50%,-50%) scale(1)';
 }
 // word card: idle bob, flip, fade letters, fly into notebook
 const bob=Math.sin(t*2.2)*6;
 const flip=eio(seg(t,E.flip,E.flip+.7)), unflip=eio(seg(t,E.q,E.q+.7));
 const ang=180*flip-180*unflip;
 $('wcF').style.transform=`rotateY(${ang}deg)`;$('wcB').style.transform=`rotateY(${ang+180}deg)`;
 // fade letters during "yadda saxlamaqdır" (after unflip)
 [...$('wcT').children].forEach((s,i)=>{const a=E.fadeA+.25+i*.22;s.style.opacity=1-.85*eo(seg(t,a,a+.5));s.style.filter=`blur(${6*seg(t,a,a+.5)}px)`});
 const fly=eio(seg(t,E.note,E.note+.8));
 // destination: notebook first entry (x≈150+128+120, y≈300+60+42)
 wcx=lerp(540,420,fly);wcy=lerp(760+bob,402,fly);ws=lerp(1,.22,fly);wr=lerp(-4,0,fly);wop=1-seg(t,E.note+.6,E.note+.8);
 const intro=1;
 if(t<E.note+.8){wc.style.display='block';wc.style.transform=`translate(${wcx}px,${wcy}px) rotate(${wr}deg) scale(${ws*(.9+.1*intro)}) perspective(1600px)`;wc.style.opacity=wop*intro}else wc.style.display='none';
 // ===== NOTEBOOK
 if(show('NOTE',t,E.note,E.logo+.35)){
  const nb=$('nb');nb.style.transform=`translateY(${(1-eo(seg(t,E.note,E.note+.5)))*80}px) scale(${1-.25*eio(seg(t,E.logo-.1,E.logo+.35))})`;
  const n=ENT.length;ENT.forEach((e,i)=>{const el=$('e'+i);
   const a=i===0?E.note+.75:lerp(E.dolur,E.uzanir+.3,(i-1)/(n-2));
   const f=E.forget+ (i*7%n)/n*(E.forgetE-E.forget-.3);
   el.style.opacity=Math.min(cl(seg(t,a,a+.18)),1-.88*eo(seg(t,f,f+.45)));
   el.style.transform=`translateX(${(1-eo(seg(t,a,a+.25)))*30}px)`});
  // list grows → pan up so last entries stay visible ("siyahı uzanır")
  const pan=eio(seg(t,E.siyahi,E.uzanir+.6));$('nbList').style.transform=`translateY(${-480*pan}px)`;
 }
 // ===== LOGO
 if(show('LOGO',t,E.logo,E.app+.3)){
  const x=seg(t,E.logo,E.logo+.45);$('logoBox').style.transform=`scale(${x<1?back(x):1}) rotate(${(1-eo(x))*-12}deg)`;
  $('logoT').style.opacity=eo(seg(t,E.logo+.25,E.logo+.6));$('logoT').style.transform=`translateY(${(1-eo(seg(t,E.logo+.25,E.logo+.6)))*30}px)`;
  $('LOGO').style.transform=`translateX(${-200*eio(seg(t,E.app-.1,E.app+.3))}px)`;
 }
 // ===== APP
 if(show('APP',t,E.app,E.box+.35)){
  $('scr').style.transform=`translateX(${(1-eio(seg(t,E.app,E.app+.75)))*900}px)`;
  $('lvlLab').style.opacity=eo(seg(t,E.lvl,E.lvl+.35));
  for(let i=0;i<6;i++){const el=$('lv'+i),a=E.lvl+.08+i*.12,x=seg(t,a,a+.35);el.style.transform=`scale(${x<1?Math.max(0,back(x)):1})`;el.style.opacity=cl(x*3);
   const on=i===2&&t>=E.pick;el.style.background=on?'var(--y)':'#fff';el.style.borderColor=on?'var(--yd)':'#dfe6dc'}
  $('APP').style.transform=`scale(${1-.06*eio(seg(t,E.box-.1,E.box+.35))})`;
 }
 if(t<E.box)tapAt(t,E.pick,371+61,1070+48);else tapAt(t,E.deck,540,620+62);
 // ===== BOXES
 const RY=r=>330+[289,466,639,814,988,1161][r-1]*600/1062; // row centers from real screenshot
 if(show('BOX',t,E.box,E.cta+.35)){
  $('bxImg').style.transform=`translateY(${(1-eo(seg(t,E.box,E.box+.5)))*60}px)`;
  const A=$('mcA'),B=$('mcB'),X=800;
  // card A: appears at row 3, moves to row 4 on "irəli"
  const ia=seg(t,E.box+.2,E.box+.6),ma=eio(seg(t,E.fwd,E.fwd+.75));
  A.style.left=X+'px';A.style.top=lerp(RY(3),RY(4),ma)+'px';A.style.opacity=cl(ia*2);A.style.transform=`scale(${ia<1?Math.max(0,back(ia)):1})`;
  pop($('pPlus'),t,E.fwd+.55,X,RY(4)+95,.4);
  // card B: appears at row 3 on "çətin", moves to row 2 on "söz", then comes forward on "qarşına"
  const ib=seg(t,E.hard,E.hard+.4),mb=eio(seg(t,E.back-.05,E.back+.5)),fw=eio(seg(t,E.again,E.again+.8));
  B.style.left=lerp(X,540,fw)+'px';B.style.top=lerp(lerp(RY(3),RY(2),mb),900,fw)+'px';B.style.opacity=cl(ib*2);
  B.style.transform=`scale(${(ib<1?Math.max(0,back(ib)):1)*lerp(1,2.4,fw)})`;
  pop($('pMinus'),t,E.back+.1,X,RY(2)-95,.35);$('pMinus').style.opacity=Math.min(cl(seg(t,E.back+.1,E.back+.25)*3),1-seg(t,E.again+.45,E.again+.75));
  $('pPlus').style.opacity=Math.min(cl(seg(t,E.fwd+.55,E.fwd+.7)*3),1-seg(t,E.again,E.again+.3));
  $('bxImg').style.opacity=1-.75*seg(t,E.again,E.again+.6);A.style.opacity=Math.min(cl(ia*2),1-.75*seg(t,E.again,E.again+.6));
  $('BOX').style.transform=`translateY(${-140*eio(seg(t,E.cta-.1,E.cta+.4))}px)`;
 }
 // ===== CTA
 if(show('CTA',t,E.cta,TT+1)){
  $('ctaT').style.transform=`translateY(${(1-eo(seg(t,E.cta,E.cta+.45)))*40}px)`;
  [E.l0,E.l1,E.l2].forEach((a,i)=>{const el=$('lc'+i),x=seg(t,a,a+.4);el.style.transform=`scale(${x<1?Math.max(0,back(x)):1})`;el.style.opacity=cl(x*3)});
  const b=seg(t,E.com,E.com+.45);$('bub').style.transform=`scale(${b<1?Math.max(0,back(b)):1})`;$('bub').style.opacity=cl(b*3);
  {const on=t>=E.deck;$('lc0').style.background=on?'var(--y)':'#fff';$('lc0').style.borderColor=on?'var(--yd)':'#dfe6dc'}
  const g=seg(t,E.gost,E.gost+.4);$('ctaLogo').style.opacity=eo(g);$('ctaLogo').style.transform=`translateY(${(1-eo(g))*30}px)`;
 }
}
window.render=render;window.E=E;window.TT=TT;
</script></body></html>
