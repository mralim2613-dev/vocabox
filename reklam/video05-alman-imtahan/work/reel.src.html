<!doctype html><html><head><meta charset="utf-8">
<style>
:root{--p:#204E40;--pd:#15382D;--pl:#EEF2E9;--y:#D8ED9B;--yd:#8FD463;--tx:#172F29;--mu:#6B7872;--gr:#16A34A}
html,body{width:1080px;height:1920px;margin:0;overflow:hidden;background:#fff;font-family:Inter,sans-serif;color:var(--tx)}
#b1{position:absolute;left:640px;top:-120px;width:720px;height:720px;border-radius:50%;background:var(--y);opacity:.55;filter:blur(10px)}
#b2{position:absolute;left:-260px;top:1180px;width:760px;height:760px;border-radius:50%;background:#d6e7dc;opacity:.8;filter:blur(10px)}
#world{position:absolute;inset:0;transform-origin:540px 820px}
.h{position:absolute;left:60px;right:60px;text-align:center;font-weight:800;letter-spacing:-1.5px;line-height:1.08}
.card{position:absolute;background:#fff;border-radius:36px;box-shadow:0 22px 60px rgba(32,78,64,.16),0 0 0 2px var(--pl)}
#cal{left:310px;top:500px;width:460px;height:470px;overflow:hidden}
#cal .top{height:110px;background:var(--p);color:#fff;font-weight:800;font-size:44px;line-height:110px;text-align:center}
#cal .rings{position:absolute;top:-18px;left:0;right:0;display:flex;justify-content:space-around;padding:0 90px}
#cal .rings i{width:22px;height:46px;border-radius:11px;background:#e3e8e1;display:block}
#cal .n{font-size:210px;font-weight:800;letter-spacing:-8px;text-align:center;line-height:260px}
#cal .s{text-align:center;font-size:40px;font-weight:700;color:var(--mu);margin-top:-30px}
.ghost{position:absolute;font-size:52px;font-weight:700;color:#9aa79f;white-space:nowrap}
#pc{left:150px;top:560px;width:780px;height:300px;transform-origin:390px 150px;z-index:5}
#pc .row{position:absolute;left:0;right:0;top:62px;text-align:center;font-size:104px;font-weight:800;letter-spacing:-3px;white-space:nowrap}
#pc .slot{display:inline-block;min-width:200px;height:110px;vertical-align:-14px;border-radius:22px;border:6px dashed #b7c6b3;margin-right:24px;box-sizing:border-box;position:relative}
#pc .tr{position:absolute;left:0;right:0;top:206px;text-align:center;font-size:42px;font-weight:700;color:var(--mu)}
.art{position:absolute;width:220px;height:120px;margin:-60px 0 0 -110px;border-radius:26px;font-size:72px;font-weight:800;text-align:center;line-height:120px;box-shadow:0 12px 30px rgba(32,78,64,.18);z-index:6}
.a0{background:var(--p);color:#fff}.a1{background:var(--y);color:var(--tx)}.a2{background:#fff;color:var(--tx);box-shadow:0 12px 30px rgba(32,78,64,.18),0 0 0 4px var(--p)}
.step{position:absolute;width:240px;border-radius:26px 26px 0 0;text-align:center;font-weight:800;font-size:78px;color:#fff;padding-top:26px;box-sizing:border-box}
.pill{position:absolute;border-radius:999px;font-weight:800;font-size:42px;padding:12px 30px;white-space:nowrap;z-index:7}
.pp{background:var(--p);color:#fff}.py{background:var(--y);color:var(--tx)}
.ring{position:absolute;border:6px solid var(--yd);border-radius:18px;z-index:7;display:none}
#real{position:absolute;left:166px;top:300px;width:749px;border-radius:34px;box-shadow:0 22px 60px rgba(32,78,64,.18),0 0 0 2px var(--pl);display:none}
#cefr{position:absolute;left:180px;top:420px;width:720px;display:none;border-radius:24px}
#boxI{position:absolute;left:390px;top:930px;width:300px;height:200px;display:none}
.lc{position:absolute;top:640px;width:230px;height:130px;line-height:126px;border-radius:999px;background:#fff;border:3px solid #dfe6dc;font-size:64px;font-weight:800;text-align:center;box-sizing:border-box;display:none}
#cap{position:absolute;left:40px;right:40px;top:1418px;text-align:center;font-weight:800;font-size:66px;line-height:1.25;z-index:10}
#cap b{display:inline-block;padding:2px 16px;margin:0 2px;border-radius:16px;text-shadow:0 0 12px #fff,0 2px 0 #fff}
#cap b.on{background:var(--gr);color:#fff;text-shadow:none}
#prog{position:absolute;left:0;bottom:0;height:10px;background:var(--p);z-index:11}
#tap{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:#fff;box-shadow:0 0 0 8px var(--p),0 10px 30px rgba(32,78,64,.25);display:none;z-index:9}
#ripple{position:absolute;border-radius:50%;border:6px solid var(--yd);display:none;z-index:8}
#bub{position:absolute;left:250px;top:880px;width:580px;height:150px;display:none}
#ctaLogo{position:absolute;left:340px;top:1090px;width:400px;display:none;align-items:center;gap:18px;justify-content:center}
</style></head><body>
<div id="b1"></div><div id="b2"></div>
<div id="world">
 <div class="h" id="hookT" style="top:300px;font-size:80px">İmtahana az qalıb…</div>
 <div class="card" id="cal"><div class="top">İmtahana</div><div class="n" id="calN">14</div><div class="s">gün qaldı</div></div>
 <div class="ghost" id="g0" style="left:120px;top:1060px">der Termin</div><div class="ghost" id="g1" style="left:600px;top:1120px">das Ergebnis</div><div class="ghost" id="g2" style="left:300px;top:1220px">sich anmelden</div>
 <div class="h" id="artT" style="top:300px;font-size:72px;opacity:0">Artiklsiz isim<br>yarımçıqdır</div>
 <div class="card" id="pc"><div class="row"><span class="slot" id="slot"></span>Prüfung<span id="pl" style="color:var(--mu);font-size:72px">, -en</span></div><div class="tr" id="pcT">imtahan; yoxlama</div></div>
 <div class="art a0" id="ar0">der</div><div class="art a1" id="ar1">die</div><div class="art a2" id="ar2">das</div>
 <div class="pill pp" id="lang" style="display:none">Vocabox · Alman dili</div>
 <div class="step" id="s0" style="left:110px;background:#8fb05a">A1</div><div class="step" id="s1" style="left:380px;background:#4f8a62">A2</div><div class="step" id="s2" style="left:650px;background:var(--p)">B1</div>
 <div class="pill py" id="p3k" style="display:none;font-size:56px">3 000+ söz</div>
 <img id="real" src="__CARD__">
 <div class="ring" id="r0"></div><div class="ring" id="r1"></div><div class="ring" id="r2"></div>
 <div class="pill pp" id="q0" style="display:none">artikl</div><div class="pill pp" id="q1" style="display:none">cəm forması</div><div class="pill py" id="q2" style="display:none">nümunə cümlə</div>
 <img id="cefr" src="__CEFR__">
 <svg id="boxI" viewBox="0 0 300 200"><rect x="16" y="0" width="268" height="150" rx="20" fill="#173a30"/><rect x="0" y="70" width="300" height="130" rx="26" fill="#204E40"/><text x="150" y="160" text-anchor="middle" font-family="Inter" font-weight="800" font-size="56" fill="#D8ED9B">Qutu 2</text></svg>
 <div class="pill py" id="again" style="display:none">↻ yenə qarşına çıxır</div>
 <div class="h" id="ctaT" style="top:330px;font-size:78px;opacity:0">Hansı səviyyəyə<br>hazırlaşırsan?</div>
 <div class="lc" id="l0" style="left:150px">A1</div><div class="lc" id="l1" style="left:425px">A2</div><div class="lc" id="l2" style="left:700px">B1</div>
 <svg id="bub" viewBox="0 0 580 150"><path d="M40 0h500a40 40 0 0 1 40 40v50a40 40 0 0 1-40 40H120l-50 20 10-20H40A40 40 0 0 1 0 90V40A40 40 0 0 1 40 0z" fill="#204E40"/>
  <g transform="translate(118 64) rotate(-18)"><path d="M-34 -4 L34 -26 L12 30 L2 6 Z" fill="#D8ED9B"/><path d="M2 6 L34 -26" stroke="#204E40" stroke-width="5" stroke-linecap="round"/></g>
  <text x="330" y="84" text-anchor="middle" font-family="Inter" font-weight="800" font-size="54" fill="#fff">Mesaj yaz</text></svg>
 <div id="ctaLogo"><div style="width:84px;height:84px">__LOGO__</div><b style="font-size:54px;letter-spacing:-1.5px">Vocabox</b></div>
</div>
<div id="tap"></div><div id="ripple"></div>
<div id="cap"></div><div id="prog"></div>
<script>
const WORDS=__WORDS__,OFF=0.4,LEAD=2/30;
const TT=Math.ceil((WORDS.at(-1).end+OFF+2)*30)/30;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),seg=(t,a,b)=>cl((t-a)/(b-a)),lerp=(a,b,x)=>a+(b-a)*x;
const eo=x=>1-(1-x)**3,eio=x=>x<.5?4*x**3:1-(-2*x+2)**3/2,back=x=>1+2.70158*(x-1)**3+1.70158*(x-1)**2,bk=x=>x<=0?0:x<1?back(x):1;
const IX=(txt,n=1)=>{let c=0;for(let i=0;i<WORDS.length;i++)if(WORDS[i].text===txt&&++c===n)return i;throw Error('söz yoxdur: '+txt)};
const ST=i=>WORDS[i].start+OFF,EN=i=>WORDS[i].end+OFF;
const E={qal:ST(IX('qalmır?')),art:ST(IX('Almancada'))-LEAD,artS:ST(IX('artiklsiz')),der:ST(IX('der,'))-LEAD,die:ST(IX('die,'))-LEAD,das:ST(IX('das.'))-LEAD,dasE:EN(IX('das.')),
 voc:ST(IX('Vocabox-da'))-LEAD,a1:ST(IX('A1,'))-LEAD,a2:ST(IX('A2'))-LEAD,b1:ST(IX('B1'))-LEAD,uc:ST(IX('üç'))-LEAD,
 isim:ST(IX('İsimlər'))-LEAD,artikl:ST(IX('artikl'))-LEAD,cem:ST(IX('cəm'))-LEAD,num:ST(IX('nümunə'))-LEAD,
 sev:ST(IX('Səviyyəni'))-LEAD,sec:ST(IX('seç,')),cet:ST(IX('çətin'))-LEAD,yene:ST(IX('yenə'))-LEAD,
 cta:ST(IX('Hansı'))-LEAD,msg:ST(IX('Mesajla'))-LEAD,gost:ST(IX('göstərək.'))};
const CH=[];{let c=[];const L=a=>a.reduce((s,i)=>s+WORDS[i].text.length+1,0);
 WORDS.forEach((w,i)=>{if(c.length&&L(c)+w.text.length>24){CH.push(c);c=[]}c.push(i);if(c.length===3||/[.,?!:]$/.test(w.text)||i===WORDS.length-1){CH.push(c);c=[]}})}
function caption(t){const el=document.getElementById('cap');let k=-1;CH.forEach((c,j)=>{if(t>=WORDS[c[0]].start+OFF-.02)k=j});
 if(k<0)return el.innerHTML='';const last=WORDS[CH[k].at(-1)],nx=CH[k+1];
 if(t>last.end+OFF+.6&&(!nx||t<WORDS[nx[0]].start+OFF-.02))return el.innerHTML='';
 const h=CH[k].map(i=>{const w=WORDS[i];return `<b${t>=w.start+OFF&&t<w.end+OFF?' class="on"':''}>${w.text}</b>`}).join('');if(el.innerHTML!==h)el.innerHTML=h}
const $=id=>document.getElementById(id);
function popc(el,t,a,x,y,b=999,dur=.35){const v=seg(t,a,a+dur);const on=v>0&&t<b;el.style.display=on?'block':'none';if(!on)return;el.style.left=x+'px';el.style.top=y+'px';el.style.transform=`translate(-50%,-50%) scale(${bk(v)})`;el.style.opacity=1-seg(t,b-.3,b)}
function tapAt(t,a,x,y){const T=$('tap'),R=$('ripple');const u=seg(t,a-.35,a+.45);
 if(u<=0||u>=1){T.style.display=R.style.display='none';return}
 T.style.display='block';T.style.left=x+'px';T.style.top=y+'px';
 const press=seg(t,a-.08,a+.04),rel=seg(t,a+.04,a+.2);T.style.transform=`scale(${1-.18*press+.18*rel})`;T.style.opacity=Math.min(seg(t,a-.35,a-.15),1-seg(t,a+.3,a+.45));
 const r=seg(t,a,a+.45);R.style.display=r>0&&r<1?'block':'none';const rr=40+90*eo(r);R.style.left=(x-rr)+'px';R.style.top=(y-rr)+'px';R.style.width=R.style.height=2*rr+'px';R.style.opacity=1-r}
function ring(el,t,a,b,x,y,w,h){const v=seg(t,a,a+.3);const on=v>0&&t<b;el.style.display=on?'block':'none';if(!on)return;el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px';el.style.height=h+'px';el.style.opacity=Math.min(v,1-seg(t,b-.25,b));el.style.transform=`scale(${1.15-.15*eo(v)})`}
function render(t){caption(t);$('prog').style.width=(1080*(1-4**-cl(t/TT))/(1-1/4))+'px';
 const ss=[0,E.art,E.voc,E.isim,E.sev,E.cta].filter(a=>a<=t).at(-1);$('world').style.transform=`scale(${1+0.025*eio(seg(t,ss,ss+3))})`;
 // ---- HOOK: countdown + fading words
 const hk=1-seg(t,E.art-.1,E.art+.3);$('hookT').style.opacity=hk;
 const cal=$('cal');cal.style.display=hk>0?'block':'none';cal.style.opacity=hk;cal.style.transform=`translateY(${-40*(1-hk)}px)`;
 const n=[14,13,12,11,10,9][Math.min(5,Math.floor(t/0.55))];$('calN').textContent=n;
 const fl=(t%0.55)/0.55;$('calN').style.transform=`scaleY(${fl<.12?1-.5*Math.sin(fl/.12*Math.PI):1})`;
 for(let i=0;i<3;i++){const g=$('g'+i);const a=.3+i*.25;const f=seg(t,E.qal-.4+i*.15,E.qal+.4+i*.15);g.style.opacity=Math.min(cl(seg(t,a,a+.3)),1-f)*hk;g.style.filter=`blur(${8*f}px)`}
 // ---- ARTICLE card (tracked)
 const pc=$('pc');const pin=seg(t,E.art,E.art+.45);
 $('artT').style.opacity=Math.min(eo(seg(t,E.art+.1,E.art+.4)),1-seg(t,E.voc-.1,E.voc+.2));
 const slot=$('slot');const FT=E.das+.45;const filled=t>=FT;
 slot.style.borderColor=filled?'transparent':(t>=E.artS?`rgba(143,212,99,${.5+.5*Math.sin(t*9)})`:'#b7c6b3');
 slot.textContent=filled?'die':'';slot.style.color='var(--p)';slot.style.minWidth=filled?'0':'200px';slot.style.marginRight=filled?'28px':'24px';
 $('pl').style.opacity=filled?eo(seg(t,FT,FT+.3)):0;$('pcT').style.opacity=filled?eo(seg(t,FT+.1,FT+.4)):0;
 // positions over time: center → small on A1 step → (hidden during real) → box → back up → hidden at CTA
 let px=540,py=710,ps=1,po=t<E.art?0:cl(pin*2);
 const toStep=eio(seg(t,E.voc+.3,E.voc+1.0));px=lerp(px,230,toStep);py=lerp(py,1060,toStep);ps=lerp(1,.3,toStep);
 const away=seg(t,E.isim-.1,E.isim+.25);po*=1-away;
 if(t>=E.cet){const back=eio(seg(t,E.cet,E.cet+.5));po=cl(back*2);const dn=eio(seg(t,E.cet+.3,E.cet+1.0));const up=eio(seg(t,E.yene,E.yene+.6));
  px=540;py=lerp(lerp(520,980,dn),640,up);ps=lerp(.45,.3,dn)*(1+.45*up);po*=1-seg(t,E.cta-.1,E.cta+.25)}
 pc.style.display=po>0?'block':'none';pc.style.opacity=po;pc.style.transform=`translate(${px-540}px,${py-710}px) scale(${ps*(t<E.voc?(.9+.1*eo(pin)):1)})`;
 // der/die/das chips
 const ax=[260,540,820],ay=1060;
 [E.der,E.die,E.das].forEach((a,i)=>{const el=$('ar'+i);const v=seg(t,a,a+.35);let x=ax[i],y=ay,s=bk(v),o=cl(v*3);
  if(i===1){const f=eio(seg(t,E.das+.1,E.das+.45));x=lerp(ax[1],318,f);y=lerp(ay,722,f);s*=lerp(1,.9,f);if(t>=E.das+.45)o=0}
  else o*=1-seg(t,E.das+.1,E.das+.4);
  el.style.display=o>0?'block':'none';el.style.left=x+'px';el.style.top=y+'px';el.style.transform=`scale(${s})`;el.style.opacity=o});
 // ---- LEVELS
 popc($('lang'),t,E.voc+.15,540,560,E.isim);
 const H=[180,300,420],stepOut=seg(t,E.isim-.1,E.isim+.25);
 [E.a1,E.a2,E.b1].forEach((a,i)=>{const el=$('s'+i),v=eo(seg(t,a,a+.45));el.style.display=v>0&&stepOut<1?'block':'none';el.style.height=(H[i]*v)+'px';el.style.top=(1330-H[i]*v)+'px';el.style.opacity=1-stepOut});
 popc($('p3k'),t,E.uc,700,790,E.isim);
 // ---- REAL CARD + annotations
 const rv=seg(t,E.isim,E.isim+.45),rOut=seg(t,E.sev-.1,E.sev+.25);const rc=$('real');rc.style.display=rv>0&&rOut<1?'block':'none';
 rc.style.opacity=Math.min(cl(rv*2),1-rOut);rc.style.transform=`translateY(${(1-eo(rv))*80}px)`;
 ring($('r0'),t,E.artikl,E.sev,292,568,110,90);ring($('r1'),t,E.cem,E.sev,694,568,76,90);ring($('r2'),t,E.num,E.sev,190,1124,700,120);
 popc($('q0'),t,E.artikl+.1,347,520,E.sev);popc($('q1'),t,E.cem+.1,733,520,E.sev);popc($('q2'),t,E.num+.1,540,1300,E.sev);
 // ---- SELECT + box
 const cv=seg(t,E.sev,E.sev+.4),cOut=seg(t,E.cta-.1,E.cta+.25);const ce=$('cefr');ce.style.display=cv>0&&cOut<1?'block':'none';
 ce.style.opacity=Math.min(cl(cv*2),1-cOut)*(1-.6*seg(t,E.cet,E.cet+.3));ce.style.transform=`translateY(${(1-eo(cv))*60}px)`;
 if(t<E.cta)tapAt(t,E.sec,540,420+190);else{$('tap').style.display='none';$('ripple').style.display='none'}
 const bv=seg(t,E.cet+.1,E.cet+.45);const bx=$('boxI');bx.style.display=bv>0&&cOut<1?'block':'none';bx.style.opacity=1-cOut;bx.style.transform=`scale(${bk(bv)})`;
 popc($('again'),t,E.yene+.35,540,1250,E.cta);
 // ---- CTA
 $('ctaT').style.opacity=eo(seg(t,E.cta+.1,E.cta+.5));$('ctaT').style.transform=`translateY(${(1-eo(seg(t,E.cta+.1,E.cta+.5)))*40}px)`;
 for(let i=0;i<3;i++){const el=$('l'+i),v=seg(t,E.cta+.35+i*.15,E.cta+.75+i*.15);el.style.display=v>0?'block':'none';el.style.transform=`scale(${bk(v)})`}
 const b=seg(t,E.msg,E.msg+.45);$('bub').style.display=b>0?'block':'none';$('bub').style.transform=`scale(${bk(b)})`;
 const g=seg(t,E.gost,E.gost+.4);$('ctaLogo').style.display=g>0?'flex':'none';$('ctaLogo').style.opacity=eo(g);$('ctaLogo').style.transform=`translateY(${(1-eo(g))*30}px)`;
}
window.render=render;window.E=E;window.TT=TT;
</script></body></html>
