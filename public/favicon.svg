<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#205043"/>
      <stop offset="1" stop-color="#12332a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e2f59e"/>
      <stop offset="1" stop-color="#8fd463"/>
    </linearGradient>
    <filter id="cardShadow" x="8" y="8" width="32" height="32" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#071914" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Icon Base -->
  <rect width="48" height="48" rx="13" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="12.25" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Tier 1: Background Card (Tilted Left) -->
  <rect x="13" y="10" width="20" height="14" rx="3.5" transform="rotate(-9 13 10)" fill="#ffffff" fill-opacity="0.18"/>

  <!-- Tier 2: Mid Card (Tilted Right) -->
  <rect x="16" y="11" width="20" height="14" rx="3.5" transform="rotate(7 16 11)" fill="#ffffff" fill-opacity="0.32"/>

  <!-- Front Box & 'V' Monogram Flow -->
  <!-- Bold dynamic 'V' representing Leitner Card Box & Vocabox -->
  <path d="M13 18.5L24 33.5L35 18.5" stroke="url(#accentGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#cardShadow)"/>
  
  <!-- Inner White Card Fold Accent -->
  <path d="M17.5 19.5L24 28.5L30.5 19.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  
  <!-- Mastery Spark / Memory Node -->
  <circle cx="24" cy="14" r="2.5" fill="#e2f59e"/>
</svg>
